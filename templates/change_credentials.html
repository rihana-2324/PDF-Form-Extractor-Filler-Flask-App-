<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Credentials - PDF Auto-Filler</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a7ea4 0%, #2dd9af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .credentials-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(120deg, #0a7ea4 0%, #2dd9af 100%);
            color: white;
            text-align: center;
            border-bottom: none;
            border-radius: 15px 15px 0 0 !important;
            padding: 2rem;
        }
        .btn-primary {
            background: linear-gradient(to right, #0a7ea4, #1cb0f6);
            border: none;
            border-radius: 25px;
            padding: 0.75rem;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            border-radius: 25px;
            padding: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="credentials-card card">
        <div class="card-header">
            <h2><i class="fas fa-key me-2"></i>Change Credentials</h2>
            <p class="mb-0">Update your login username and password</p>
        </div>
        <div class="card-body p-4">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="btn btn-primary">Go to Login</a>
            </div>
            {% else %}
            <form method="POST">
                <div class="mb-3">
                    <label for="current_username" class="form-label">Current Username</label>
                    <input type="text" class="form-control" id="current_username" name="current_username" required>
                </div>
                <div class="mb-3">
                    <label for="current_password" class="form-label">Current Password</label>
                    <input type="password" class="form-control" id="current_password" name="current_password" required>
                </div>
                <hr>
                <div class="mb-3">
                    <label for="new_username" class="form-label">New Username</label>
                    <input type="text" class="form-control" id="new_username" name="new_username" required>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Update Credentials</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
